steps:
  install:
    image: node:20-slim
    commands:
      - npm ci
  lint-js:
    image: node:20-slim
    group: lint
    commands:
      - npm run lint:js
    depends_on: [install]
  lint-hbs:
    image: node:20-slim
    group: lint
    commands:
      - npm run lint:hbs
    depends_on: [install]
  test:
    image: danlynn/ember-cli:4.12.1
    commands:
      - npm ci
      - npm run test:ember
    depends_on: [install]
when:
  - event: pull_request
